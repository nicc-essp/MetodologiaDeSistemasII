# Archivo independiente: no combinar con docker-compose.yml ni usar el proyecto de desarrollo.
services:
  postgres:
    image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    environment:
      POSTGRES_DB: docker_laws_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
      APP_PASSWORD_FILE: /run/secrets/postgres_app
      MIGRATOR_PASSWORD_FILE: /run/secrets/postgres_migrator
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-0}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./docker/postgres/inicializar.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
    secrets: [postgres_admin, postgres_app, postgres_migrator]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres_test_data:

secrets:
  postgres_admin:
    file: ${POSTGRES_TEST_SECRETS_DIR:-./secrets/postgres-test}/admin.txt
  postgres_app:
    file: ${POSTGRES_TEST_SECRETS_DIR:-./secrets/postgres-test}/app.txt
  postgres_migrator:
    file: ${POSTGRES_TEST_SECRETS_DIR:-./secrets/postgres-test}/migrator.txt
